<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Check-In</title>
  <meta name="description" content="A quick 15-second check-in questionnaire.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="main-title">This is a test.<br><span class="highlight-text">Please trust me and answer.</span></h1>
      <p class="subtitle">There are no right or wrong answers. Just your honest gut reaction right now.</p>
    </header>


    <main class="form-container" id="form-container">
      <form id="tracker-form" autocomplete="off">
        <!-- Step 1: Name -->
        <div class="input-group">
          <label for="user-name" class="section-label">1. What's your name or nickname?</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="user-name" 
              name="userName" 
              placeholder="e.g. Alex, Sam, Jordan..." 
              required
              maxlength="40"
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Step 2: Mood Cards (Rendered in static HTML for 100% reliability) -->
        <div class="input-group">
          <label class="section-label">2. How are you honestly feeling right now?</label>
          <div class="mood-grid" id="mood-grid" role="radiogroup" aria-label="Current Mood">
            
            <!-- Card 1 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🔥 On a roll today" required>
              <div class="mood-card-header">
                <span class="mood-card-emoji">🔥</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">On a roll today</div>
              <div class="mood-card-desc">Sharp, productive, high momentum</div>
            </label>

            <!-- Card 2 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🌊 Cruising / Chill">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🌊</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Cruising / Chill</div>
              <div class="mood-card-desc">Relaxed, steady, good headspace</div>
            </label>

            <!-- Card 3 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🌧️ Mood off">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🌧️</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Mood off</div>
              <div class="mood-card-desc">Down, glum, out of rhythm</div>
            </label>

            <!-- Card 4 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🤯 Chaos mode / Overwhelmed">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🤯</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Chaos mode</div>
              <div class="mood-card-desc">Overwhelmed, 100 tabs open, restless</div>
            </label>

            <!-- Card 5 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="😐 Just existing / Meh">
              <div class="mood-card-header">
                <span class="mood-card-emoji">😐</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Just existing / Meh</div>
              <div class="mood-card-desc">Autopilot, neutral, whatever</div>
            </label>

            <!-- Card 6 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🪫 Low battery / Drained">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🪫</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Low battery</div>
              <div class="mood-card-desc">Exhausted, running on empty, need sleep</div>
            </label>

            <!-- Card 7 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="⚡ Ready to snap">
              <div class="mood-card-header">
                <span class="mood-card-emoji">⚡</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Ready to snap</div>
              <div class="mood-card-desc">Irritable, short fuse, agitated</div>
            </label>

            <!-- Card 8 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🌀 Deep in my head">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🌀</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Deep in my head</div>
              <div class="mood-card-desc">Overthinking, contemplative, quiet</div>
            </label>

            <!-- Card 9 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="✨ Hyped / Buzzing">
              <div class="mood-card-header">
                <span class="mood-card-emoji">✨</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Hyped / Buzzing</div>
              <div class="mood-card-desc">Excited, positive anticipation, energetic</div>
            </label>

          </div>
        </div>

        <!-- Submit Button -->
        <div class="action-wrapper">
          <button type="submit" id="submit-btn" class="submit-btn" disabled>
            <span class="btn-text">Submit My Answer</span>
            <span class="btn-arrow">→</span>
            <span class="spinner" id="btn-spinner" aria-hidden="true"></span>
          </button>
          <p class="privacy-note">🔒 Responses are saved securely to our test log.</p>
        </div>
      </form>
    </main>

    <!-- Success Screen (Initially Hidden) -->
    <div class="success-container" id="success-container" aria-live="polite" hidden>
      <div class="success-card">
        <div class="success-icon-wrapper">
          <svg class="success-checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>
        <h2 class="success-title">Answer Recorded.</h2>
        <p class="success-subtitle">Thank you for your honesty and trust. Your response has been locked in.</p>
        <button type="button" id="reset-btn" class="secondary-btn">Submit another response</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
