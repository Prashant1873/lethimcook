<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Check-In</title>
  <meta name="description" content="A quick 15-second check-in questionnaire.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="main-title">This is a test.<br><span class="highlight-text">Please trust me and answer.</span></h1>
      <p class="subtitle">There are no right or wrong answers. Just your honest gut reaction right now.</p>
    </header>

    <main class="form-container" id="form-container">
      <form id="tracker-form" autocomplete="off" novalidate>
        <!-- Step 1: Name -->
        <div class="input-group">
          <label for="user-name" class="section-label">1. What's your name or nickname?</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="user-name" 
              name="userName" 
              placeholder="e.g. Alex, Sam, Jordan..." 
              required
              maxlength="40"
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Step 2: Mood Cards -->
        <div class="input-group">
          <label class="section-label">2. How are you honestly feeling right now?</label>
          <div class="mood-grid" id="mood-grid" role="radiogroup" aria-label="Current Mood">
            
            <!-- Card 1 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🔥 On a roll today" required>
              <div class="mood-card-header">
                <span class="mood-card-emoji">🔥</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">On a roll today</div>
              <div class="mood-card-desc">Sharp, productive, high momentum</div>
            </label>

            <!-- Card 2 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🌊 Cruising / Chill">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🌊</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Cruising / Chill</div>
              <div class="mood-card-desc">Relaxed, steady, good headspace</div>
            </label>

            <!-- Card 3 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🌧️ Mood off">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🌧️</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Mood off</div>
              <div class="mood-card-desc">Down, glum, out of rhythm</div>
            </label>

            <!-- Card 4 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🤯 Chaos mode / Overwhelmed">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🤯</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Chaos mode</div>
              <div class="mood-card-desc">Overwhelmed, 100 tabs open, restless</div>
            </label>

            <!-- Card 5 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="😐 Just existing / Meh">
              <div class="mood-card-header">
                <span class="mood-card-emoji">😐</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Just existing / Meh</div>
              <div class="mood-card-desc">Autopilot, neutral, whatever</div>
            </label>

            <!-- Card 6 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🪫 Low battery / Drained">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🪫</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Low battery</div>
              <div class="mood-card-desc">Exhausted, running on empty, need sleep</div>
            </label>

            <!-- Card 7 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="⚡ Ready to snap">
              <div class="mood-card-header">
                <span class="mood-card-emoji">⚡</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Ready to snap</div>
              <div class="mood-card-desc">Irritable, short fuse, agitated</div>
            </label>

            <!-- Card 8 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="🌀 Deep in my head">
              <div class="mood-card-header">
                <span class="mood-card-emoji">🌀</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Deep in my head</div>
              <div class="mood-card-desc">Overthinking, contemplative, quiet</div>
            </label>

            <!-- Card 9 -->
            <label class="mood-card" tabindex="0">
              <input type="radio" name="mood" value="✨ Hyped / Buzzing">
              <div class="mood-card-header">
                <span class="mood-card-emoji">✨</span>
                <span class="mood-card-check" aria-hidden="true"></span>
              </div>
              <div class="mood-card-title">Hyped / Buzzing</div>
              <div class="mood-card-desc">Excited, positive anticipation, energetic</div>
            </label>

          </div>
        </div>

        <!-- Submit Button -->
        <div class="action-wrapper">
          <div id="form-error" class="form-error" hidden></div>
          <button type="submit" id="submit-btn" class="submit-btn">
            <span class="btn-text">Submit My Answer</span>
            <span class="btn-arrow">→</span>
          </button>
          <p class="privacy-note">🔒 Responses are saved securely to our test log.</p>
        </div>
      </form>
    </main>

    <!-- Success Screen (Initially Hidden) -->
    <div class="success-container" id="success-container" aria-live="polite" hidden>
      <div class="success-card">
        <div class="success-icon-wrapper">
          <svg class="success-checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>
        <h2 class="success-title">Answer Recorded.</h2>
        <p class="success-subtitle">Thank you for your honesty and trust. Your response has been locked in.</p>
        <button type="button" id="reset-btn" class="secondary-btn">Submit another response</button>
      </div>
    </div>

  </div>

  <script>
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbyJT7DnJl5vF3weap2-shmoSPiRtU_KeWUZpTvgjkN6hfNMRMqcsUgkusrWC_Tyssy49A/exec";

    function calculateSecretLunarPhase(date = new Date()) {
      const epoch = Date.UTC(2000, 0, 6, 18, 14, 0);
      const diffDays = (date.getTime() - epoch) / (1000 * 60 * 60 * 24);
      const synodicMonth = 29.530588853;
      let phaseAge = diffDays % synodicMonth;
      if (phaseAge < 0) phaseAge += synodicMonth;
      const theta = (phaseAge / synodicMonth) * 2 * Math.PI;
      const illuminationPct = Math.round(((1 - Math.cos(theta)) / 2) * 100);

      let phaseName = "";
      let phaseEmoji = "";
      if (phaseAge < 1.84566) { phaseName = "New Moon"; phaseEmoji = "🌑"; }
      else if (phaseAge < 5.53699) { phaseName = "Waxing Crescent"; phaseEmoji = "🌒"; }
      else if (phaseAge < 9.22831) { phaseName = "First Quarter"; phaseEmoji = "🌓"; }
      else if (phaseAge < 12.91963) { phaseName = "Waxing Gibbous"; phaseEmoji = "🌔"; }
      else if (phaseAge < 16.61096) { phaseName = "Full Moon"; phaseEmoji = "🌕"; }
      else if (phaseAge < 20.30228) { phaseName = "Waning Gibbous"; phaseEmoji = "🌖"; }
      else if (phaseAge < 23.99361) { phaseName = "Last Quarter"; phaseEmoji = "🌗"; }
      else if (phaseAge < 27.68493) { phaseName = "Waning Crescent"; phaseEmoji = "🌘"; }
      else { phaseName = "New Moon"; phaseEmoji = "🌑"; }

      return { phaseName, phaseEmoji, illumination: illuminationPct + "%", moonAge: phaseAge.toFixed(1) + " days" };
    }

    function initTracker() {
      const trackerForm = document.getElementById("tracker-form");
      const userNameInput = document.getElementById("user-name");
      const submitBtn = document.getElementById("submit-btn");
      const formContainer = document.getElementById("form-container");
      const successContainer = document.getElementById("success-container");
      const resetBtn = document.getElementById("reset-btn");
      const formError = document.getElementById("form-error");
      const moodCards = document.querySelectorAll(".mood-card");

      function showError(msg) {
        if (!formError) return;
        formError.textContent = msg;
        formError.hidden = false;
      }

      function clearError() {
        if (!formError) return;
        formError.textContent = "";
        formError.hidden = true;
        if (userNameInput) userNameInput.classList.remove("error");
      }

      moodCards.forEach((card) => {
        const radio = card.querySelector('input[type="radio"]');
        function selectCard() {
          if (radio) radio.checked = true;
          moodCards.forEach((c) => c.classList.remove("selected"));
          card.classList.add("selected");
          clearError();
        }
        card.addEventListener("click", selectCard);
        card.addEventListener("keydown", (e) => {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            selectCard();
          }
        });
        if (radio) {
          radio.addEventListener("change", () => {
            moodCards.forEach((c) => c.classList.remove("selected"));
            if (radio.checked) card.classList.add("selected");
            clearError();
          });
        }
      });

      if (userNameInput) {
        userNameInput.addEventListener("input", clearError);
      }

      function handleFormSubmit(e) {
        if (e) e.preventDefault();

        const name = userNameInput ? userNameInput.value.trim() : "";
        const selectedRadio = trackerForm ? trackerForm.querySelector('input[name="mood"]:checked') : null;

        if (!name) {
          showError("Please enter your name or nickname to continue.");
          if (userNameInput) {
            userNameInput.classList.add("error");
            userNameInput.focus();
          }
          return;
        }

        if (!selectedRadio) {
          showError("Please select one of the cards above to answer.");
          return;
        }

        clearError();

        if (submitBtn) {
          submitBtn.disabled = true;
          const textEl = submitBtn.querySelector(".btn-text");
          if (textEl) textEl.textContent = "Recording...";
        }

        const now = new Date();
        const lunarData = calculateSecretLunarPhase(now);
        const payload = {
          localTime: now.toLocaleString(),
          isoTimestamp: now.toISOString(),
          moonPhase: lunarData.phaseName,
          illumination: lunarData.illumination,
          moonAge: lunarData.moonAge,
          name: name,
          mood: selectedRadio.value
        };

        fetch(GOOGLE_SHEETS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).catch((err) => console.warn(err));

        setTimeout(() => {
          if (formContainer) formContainer.hidden = true;
          if (successContainer) successContainer.hidden = false;
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, 200);
      }

      if (trackerForm) trackerForm.addEventListener("submit", handleFormSubmit);
      if (submitBtn) submitBtn.addEventListener("click", handleFormSubmit);

      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          if (trackerForm) trackerForm.reset();
          moodCards.forEach((c) => c.classList.remove("selected"));
          if (submitBtn) {
            submitBtn.disabled = false;
            const textEl = submitBtn.querySelector(".btn-text");
            if (textEl) textEl.textContent = "Submit My Answer";
          }
          clearError();
          if (formContainer) formContainer.hidden = false;
          if (successContainer) successContainer.hidden = true;
          if (userNameInput) userNameInput.focus();
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initTracker);
    } else {
      initTracker();
    }
  </script>
</body>
</html>
