<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Check-In</title>
  <meta name="description" content="A quick 15-second check-in questionnaire.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="pill-badge">
        <span class="pulse-dot"></span>
        <span class="badge-text">15-Second Pulse</span>
      </div>
      <h1 class="main-title">This is a test.<br><span class="highlight-text">Please trust me and answer.</span></h1>
      <p class="subtitle">There are no right or wrong answers. Just your honest gut reaction right now.</p>
    </header>

    <main class="form-container" id="form-container">
      <form id="tracker-form" autocomplete="off" onsubmit="return false;">
        <!-- Step 1: Name -->
        <div class="input-group">
          <label for="user-name" class="section-label">1. What's your name or nickname?</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="user-name" 
              name="userName" 
              placeholder="e.g. Alex, Sam, Jordan..." 
              required
              maxlength="40"
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Step 2: Mood Cards -->
        <div class="input-group">
          <label class="section-label">2. How are you honestly feeling right now?</label>
          <div class="mood-grid" id="mood-grid" role="radiogroup" aria-label="Current Mood">
            <!-- Cards will be rendered by JS with casual terms -->
          </div>
        </div>

        <!-- Submit Button -->
        <div class="action-wrapper">
          <button type="submit" id="submit-btn" class="submit-btn" disabled>
            <span class="btn-text">Submit My Answer</span>
            <span class="btn-arrow">→</span>
            <span class="spinner" id="btn-spinner" aria-hidden="true"></span>
          </button>
          <p class="privacy-note">🔒 Responses are saved securely to our test log.</p>
        </div>
      </form>
    </main>

    <!-- Success Screen (Initially Hidden) -->
    <div class="success-container" id="success-container" aria-live="polite" hidden>
      <div class="success-card">
        <div class="success-icon-wrapper">
          <svg class="success-checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>
        <h2 class="success-title">Answer Recorded.</h2>
        <p class="success-subtitle">Thank you for your honesty and trust. Your response has been locked in.</p>
        <button type="button" id="reset-btn" class="secondary-btn">Submit another response</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
